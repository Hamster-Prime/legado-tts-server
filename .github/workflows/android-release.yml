name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'android-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (leave blank for android-latest)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether Android build is needed
        id: filter
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(android/|\.github/workflows/android-release\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Android changes in this push; skipping APK build."
          fi

      - name: Set up JDK 21
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK Platform 37.0 & Build Tools
        if: steps.filter.outputs.run == 'true'
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER (SDK_ROOT=$SDK_ROOT)"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37.0" "build-tools;37.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        if: steps.filter.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Run unit tests & lint
        if: steps.filter.outputs.run == 'true'
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Build optimized Release APK
        if: steps.filter.outputs.run == 'true'
        id: build
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          mkdir -p "$RUNNER_TEMP/release-assets"

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_* Actions secrets. Refusing to publish a Release APK with an ephemeral debug key (which breaks in-place upgrades)."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          export RELEASE_STORE_FILE="$RUNNER_TEMP/release.keystore"
          SIGN_NOTE="Release 模式 + R8 性能优化，使用固定 Release 密钥签名（支持后续版本直接覆盖升级）"

          ./gradlew :app:assembleRelease -PrequireReleaseSigning=true
          SRC_APK="app/build/outputs/apk/release/app-release.apk"
          OUT_NAME="Legado-TTS-Reader-${VERSION}.apk"

          VERIFY_OUT=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$SRC_APK")
          echo "$VERIFY_OUT"
          CERT_SHA256=$(printf '%s\n' "$VERIFY_OUT" | grep -m1 'certificate SHA-256 digest:' | awk '{print $NF}')
          cp "$SRC_APK" "$RUNNER_TEMP/release-assets/${OUT_NAME}"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum "${OUT_NAME}" > "${OUT_NAME}.sha256")
          SHA256=$(cut -d' ' -f1 "$RUNNER_TEMP/release-assets/${OUT_NAME}.sha256")

          echo "apk_name=${OUT_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"
          echo "sign_note=${SIGN_NOTE}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: steps.filter.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.apk_name }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: steps.filter.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag_name }}
          VERSION: ${{ steps.build.outputs.version }}
          APK_NAME: ${{ steps.build.outputs.apk_name }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          CERT_SHA256: ${{ steps.build.outputs.cert_sha256 }}
          SIGN_NOTE: ${{ steps.build.outputs.sign_note }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="声读 · Legado TTS ${TAG}"
            IS_ROLLING=false
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            TITLE="声读 · Legado TTS ${TAG}"
            IS_ROLLING=false
          else
            TAG="android-latest"
            TITLE="声读 · Legado TTS v${VERSION} (Latest)"
            IS_ROLLING=true
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## 声读 · Legado TTS Android 客户端

          - **版本**：\`v${VERSION}\`
          - **构建提交**：\`${SHORT_SHA}\`
          - **产物文件**：\`${APK_NAME}\`
          - **SHA-256**：\`${SHA256}\`
          - **签名证书 SHA-256**：\`${CERT_SHA256}\`
          - **构建说明**：${SIGN_NOTE}
          - **最低系统**：Android 9 (API 28)+

          > 从 \`v1.2\` 起统一使用仓库固定 Release 证书签名。若设备此前安装的是早期使用临时 Debug 证书构建的 \`v1.0\` / \`v1.1\`，请先卸载旧版再安装；此后所有新版本均可直接覆盖更新。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$IS_ROLLING" = "true" ]; then
              git tag -f "$TAG" "$GITHUB_SHA"
              git push --force origin "refs/tags/${TAG}"
              EXISTING_ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' || true)
              for ASSET in $EXISTING_ASSETS; do
                if [ "$ASSET" != "$APK_NAME" ] && [ "$ASSET" != "${APK_NAME}.sha256" ]; then
                  gh release delete-asset "$TAG" "$ASSET" --yes || true
                fi
              done
            fi
            gh release upload "$TAG" \
              "$RUNNER_TEMP/release-assets/${APK_NAME}" \
              "$RUNNER_TEMP/release-assets/${APK_NAME}.sha256" \
              --clobber
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" \
              "$RUNNER_TEMP/release-assets/${APK_NAME}" \
              "$RUNNER_TEMP/release-assets/${APK_NAME}.sha256" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --target "$GITHUB_SHA"
          fi
