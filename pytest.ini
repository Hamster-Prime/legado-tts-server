[pytest]
testpaths = test_app.py
# Per-test wall-clock cap. A lock-ordering bug in the app can otherwise hang the
# whole run instead of failing one test. Requires pytest-timeout
# (requirements-dev.txt); without the plugin pytest warns that the option is
# unknown and ignores it, which is harmless.
timeout = 60
filterwarnings =
    ignore::DeprecationWarning
